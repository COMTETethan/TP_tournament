name: CI

on:
  push:
    branches: [main, dev, "feature/**", "fix/**"]
  pull_request:
    branches: [main, dev]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run tests with coverage
        run: |
          dotnet test --no-build --configuration Release \
            --settings coverage.runsettings \
            --results-directory ./TestResults \
            --collect:"XPlat Code Coverage"

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate coverage report
        run: |
          reportgenerator \
            -reports:"./TestResults/**/coverage.cobertura.xml" \
            -targetdir:"./coverage-report" \
            -reporttypes:"Html;MarkdownSummaryGithub;Cobertura"

      - name: Write coverage summary to job summary
        run: cat ./coverage-report/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./coverage-report/
          retention-days: 14

      - name: Check branch coverage threshold (≥ 95%)
        run: |
          COVERED=$(grep -oP 'branch-rate="\K[0-9.]+' ./coverage-report/Cobertura.xml | head -1)
          PCT=$(awk "BEGIN { printf \"%.1f\", $COVERED * 100 }")
          echo "Branch coverage: ${PCT}%"
          awk "BEGIN { if ($COVERED < 0.95) { print \"Branch coverage ${PCT}% is below 95% threshold\"; exit 1 } }"
